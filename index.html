<!doctype html>
<html lang="ar" dir="rtl" data-title-ar="تطبيقات Shahin" data-title-en="Apps by Shahin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apps by Shahin</title>
  <meta name="description" content="Apps by Shahin, with the support and privacy pages for each app.">
  <link rel="icon" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/lang.js"></script>
</head>
<body>
<main>
  <div class="lang-switch" role="group" aria-label="Language / اللغة">
    <button type="button" data-set-lang="ar" lang="ar">العربية</button>
    <button type="button" data-set-lang="en" lang="en">English</button>
  </div>

  <header class="app-head">
    <h1 lang="en" dir="ltr">Shahin</h1>
    <svg class="ornament" width="140" height="14" viewBox="0 0 140 14" aria-hidden="true">
      <path d="M0 7h58M82 7h58" stroke="currentColor" stroke-width="1"/>
      <g transform="translate(70 7)" fill="currentColor">
        <rect x="-4.5" y="-4.5" width="9" height="9"/>
        <rect x="-4.5" y="-4.5" width="9" height="9" transform="rotate(45)"/>
      </g>
    </svg>
  </header>

  <h2 class="apps-title"><span class="only-ar" lang="ar">التطبيقات</span><span class="only-en" lang="en">Apps</span></h2>

  <!-- One card per app, one per row. To add an app: copy an <a class="app-card"> block and change
       its link, icon, names and line. The "coming soon" card stays last; remove it if you like. -->
  <nav class="apps" aria-label="Apps">
    <a class="app-card" href="adwamuha/" data-keep-lang>
      <img src="adwamuha/icon.png" width="64" height="64" alt="">
      <div>
        <strong class="only-ar" lang="ar">أَدْوَمُهَا</strong>
        <strong class="only-en" lang="en">Adwamuha · أَدْوَمُهَا</strong>
        <span class="only-ar" lang="ar">دقائق هادئة مع أذكارك كل يوم. مجاني، بلا إعلانات ولا تتبّع.</span>
        <span class="only-en" lang="en">A few calm minutes with your azkar, every day. Free, no ads, no tracking.</span>
      </div>
    </a>
    <div class="app-card soon" aria-hidden="true">
      <span class="soon-icon">+</span>
      <div>
        <span class="only-ar" lang="ar">تطبيقات أخرى قريبًا</span>
        <span class="only-en" lang="en">More apps soon</span>
      </div>
    </div>
  </nav>

  <footer>© 2026 Shahin</footer>
</main>
</body>
</html>
